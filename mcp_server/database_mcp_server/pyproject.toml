[build-system]
requires = ["uv_build>=0.9.0"]
build-backend = "uv_build"

[project]
name = "postgres-server"
version = "0.1.0"
description = "PostgreSQL MCP Server - Query and inspect PostgreSQL databases with historical inventory data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.15.0",
    "smithery>=0.4.2",
    "fastmcp>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0.0",
]

[project.scripts]
dev = "smithery.cli.dev:main"
playground = "smithery.cli.playground:main"

[tool.smithery]
server = "postgres_server.server:create_server"